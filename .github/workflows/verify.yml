name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify
        run: make verify
      - name: Build
        run: go build -ldflags="-s -w" -o atlas ./cmd/atlas
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-darwin-${{ runner.arch }}
          path: atlas
